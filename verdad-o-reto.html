<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdad o Reto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== Variables de la paleta pastel ===== */
:root{
  --bg:#ffeef5; --rosa:#ffb7d0; --celeste:#c7e3ff; --lila:#d9c2f0;
  --menta:#c8f2d4; --durazno:#ffd9b8; --amarillo:#fff4b8; --ink:#4d2c5e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#ffd5d9; color:var(--ink);
  font-family:'Press Start 2P',monospace; font-size:12px; line-height:1.8;
  image-rendering:pixelated; overflow-x:hidden;
}
/* Fuente árabe: más grande y con más interlineado */
html[lang="ar"] body{font-family:'Noto Kufi Arabic',sans-serif;font-size:16px;line-height:2.1;font-weight:500}
html[lang="ar"] .btn,html[lang="ar"] .title{font-weight:700}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:64px 16px 32px;min-height:100vh;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.hidden{display:none!important}

/* ===== Selector de idioma ===== */
.langs{position:fixed;top:8px;inset-inline-end:8px;z-index:10;display:flex;gap:6px}
.langs button{font:inherit;font-size:10px;color:var(--ink);background:#fff;border:3px solid var(--ink);padding:8px 10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:44px;min-height:40px}
.langs button[aria-pressed="true"]{background:var(--amarillo)}
.langs button:active{transform:translate(3px,3px);box-shadow:none}
html[lang="ar"] .langs button{font-family:'Noto Kufi Arabic',sans-serif}

/* ===== Componentes pixel ===== */
.box{background:rgba(255,255,255,.93);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px;text-align:start}
.btn{--c:var(--lila);position:relative;font:inherit;font-size:13px;color:var(--ink);border:0;margin:4px;width:calc(100% - 8px);padding:16px 40px;min-height:56px;cursor:pointer;text-shadow:1px 1px 0 rgba(255,255,255,.75);
  background:linear-gradient(#fff,#fff) right 14px top 9px/8px 2px no-repeat,linear-gradient(#fff,#fff) right 17px top 6px/2px 8px no-repeat,
    linear-gradient(180deg,color-mix(in srgb,var(--c) 50%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#e0669b) 100%);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 4px 0 0 rgba(255,255,255,.7),inset 4px 0 0 0 rgba(255,255,255,.4),inset 0 -6px 0 0 rgba(214,90,143,.28),inset -4px 0 0 0 rgba(214,90,143,.16);
  filter:drop-shadow(4px 5px 0 rgba(77,44,94,.3));transition:filter .1s}
.btn::before{content:"";position:absolute;inset-inline-start:12px;top:50%;width:20px;height:20px;margin-top:-10px;background:var(--flor) center/contain no-repeat;image-rendering:pixelated}
.btn:hover{filter:brightness(1.07) drop-shadow(4px 5px 0 rgba(77,44,94,.3))}
.btn.new::after{content:" ●";color:#e0306e}
.btn:active{transform:translate(3px,4px);filter:none}
.btn:focus-visible,input:focus-visible,.langs button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn.verdad{--c:var(--celeste)} .btn.reto{--c:var(--rosa)}
.btn.ok{--c:var(--menta)} .btn.skip{--c:var(--durazno)}
input{font:inherit;font-size:16px;text-transform:uppercase;letter-spacing:4px;text-align:center;color:var(--ink);background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;width:100%;min-height:56px;direction:ltr}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.title{font-size:clamp(24px,8vw,44px);line-height:1.3;text-align:center;margin:12px 0 8px;color:#fff;text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),6px 6px 0 var(--rosa)}
.title::before,.title::after{content:"";display:inline-block;width:.9em;height:.9em;background:var(--flor) center/contain no-repeat;image-rendering:pixelated;margin:0 .3em;vertical-align:middle}
html[lang="ar"] .title{font-size:clamp(34px,11vw,60px);line-height:1.5}
.msg{min-height:1.8em;text-align:center;font-size:11px}
html[lang="ar"] .msg{font-size:15px}
.msg.err{background:var(--rosa);border:3px solid var(--ink);padding:8px}
.code{direction:ltr;unicode-bidi:isolate;font-family:'Press Start 2P',monospace;font-size:clamp(32px,12vw,56px);letter-spacing:8px;text-align:center;background:var(--amarillo);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px}
.banner{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;text-align:center}
.banner.host,.score.host{background:var(--menta)} .banner.guest,.score.guest{background:var(--durazno)}
.scores{display:flex;gap:12px}
.score{flex:1;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;font-size:10px}
html[lang="ar"] .score{font-size:14px}
.score b{display:block;margin-bottom:4px}

/* ===== Cuadro de diálogo tipo videojuego ===== */
.dialog{background:rgba(255,255,255,.94);border:6px solid var(--ink);box-shadow:6px 6px 0 var(--ink),inset 0 0 0 4px var(--rosa);padding:20px;min-height:170px;font-size:13px;line-height:2}
html[lang="ar"] .dialog{font-size:18px;line-height:2.2}
.tag{display:inline-block;border:3px solid var(--ink);padding:2px 8px;margin-bottom:8px;font-size:10px}
html[lang="ar"] .tag{font-size:14px}
.tag.verdad{background:var(--celeste)} .tag.reto{background:var(--rosa)}
.caret::after{content:"▮";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== Escena anime de fondo ===== */
.deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.deco canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
/* ===== Chat ===== */
.chat{display:flex;flex-direction:column;gap:10px;padding:12px}
.chatlog{height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;background:var(--bg);border:3px solid var(--ink)}
.bubble{max-width:85%;border:3px solid var(--ink);padding:6px 10px;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif;font-size:14px;line-height:1.8;word-break:break-word;white-space:pre-wrap}
.bubble .orig{margin-top:4px;padding-top:4px;border-top:2px dashed var(--ink);font-size:11px;line-height:1.7;opacity:.7}
.bubble.mine{align-self:flex-end;background:var(--menta)}
.bubble.theirs{align-self:flex-start;background:var(--celeste)}
#chatIn{text-transform:none;letter-spacing:0;text-align:start;font-size:14px;direction:ltr;unicode-bidi:plaintext;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif}
.chatbar .btn{font-size:12px;min-height:48px;padding:10px}
.chatbar .btn::before{display:none}
.chatbar{display:flex;gap:10px}.chatbar .btn{flex:1}
.bubble img{display:block;max-width:100%;max-height:160px;cursor:zoom-in;image-rendering:auto;border:2px solid var(--ink);background:#fff}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(91,75,107,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border:4px solid #fff;image-rendering:auto}
#musicIn{text-transform:none;letter-spacing:0;text-align:start;font-size:14px;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif}
#player{aspect-ratio:16/9;width:100%;background:#000;border:4px solid var(--ink)}
#player:empty{display:none}
#player iframe{display:block;width:100%;height:100%}
.btn.music{--c:var(--amarillo)}
@media (prefers-reduced-motion:reduce){.caret::after{animation:none}}
.btn#bTrans[aria-pressed="true"]{background:var(--menta)}
.stkpanel .gtabs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.stkpanel .gtabs button{flex-direction:row;font-size:8px;padding:6px 8px;box-shadow:2px 2px 0 var(--ink)}
.stkpanel .gtabs button[aria-pressed="true"]{background:var(--amarillo)}
/* ===== Selector de temas ===== */
.trow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.trow button{font-size:20px;line-height:1;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:44px;height:44px;cursor:pointer;padding:0}
.trow button[aria-pressed="true"]{background:var(--amarillo)}
.trow button:active{transform:translate(3px,3px);box-shadow:none}
.trow button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.themes .msg{margin-top:10px}
html.dark #lobbyMsg:not(:empty){background:rgba(255,255,255,.92);border:3px solid var(--ink);padding:8px}

/* ===== Perfil y pantalla de juego personalizada ===== */
.snd{position:fixed;top:8px;inset-inline-start:8px;z-index:10;font-size:18px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:44px;height:40px;cursor:pointer;padding:0}
.snd:active{transform:translate(3px,3px);box-shadow:none}
.profile{display:flex;flex-direction:column;gap:12px}
.avrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.avrow button{font-size:24px;line-height:1;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:46px;height:46px;cursor:pointer;padding:0}
.avrow button[aria-pressed="true"]{background:var(--amarillo);transform:translateY(-3px) scale(1.08)}
#nameIn{text-transform:none;letter-spacing:1px;font-size:14px;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif}
.pcards{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs{font-size:14px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.pcard{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:9px;line-height:1.5;opacity:.82;transition:transform .2s}
html[lang="ar"] .pcard{font-size:13px}
.pcard.host{background:var(--menta)} .pcard.guest{background:var(--durazno)}
.pcard.active{opacity:1;transform:translateY(-4px);box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px var(--ink);animation:glow 1.4s ease-in-out infinite}
.pav{font-size:34px;line-height:1.1;display:inline-block}
.pcard.active .pav{animation:bob .8s steps(2) infinite}
.pname{font-size:11px;word-break:break-word;max-width:100%}
html[lang="ar"] .pname{font-size:15px}
.plv{background:rgba(255,255,255,.75);border:2px solid var(--ink);padding:1px 6px}
.ppts{font-size:12px;color:#c0366e}
html[lang="ar"] .ppts{font-size:15px}
.banner.mine{background:var(--amarillo)}
.tag.round{background:var(--amarillo);margin-inline-end:6px}
.dialog.verdad{box-shadow:6px 6px 0 var(--ink),inset 0 0 0 4px var(--celeste)}
.dialog.reto{box-shadow:6px 6px 0 var(--ink),inset 0 0 0 4px #ff94b8}
.dialog.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
#choose .btn.verdad::after{content:" 🔮"} #choose .btn.reto::after{content:" 🔥"}
.toast{position:fixed;top:60px;inset-inline:0;margin:0 auto;width:max-content;max-width:90vw;z-index:30;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-size:12px;text-align:center;animation:toast 2.6s ease both;pointer-events:none}
html[lang="ar"] .toast{font-size:16px}
.toast.ok{background:var(--menta)} .toast.skip{background:var(--durazno)}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes glow{50%{filter:brightness(1.1)}}
@keyframes pop{0%{transform:scale(.8) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes toast{0%{transform:translateY(-30px);opacity:0}12%,80%{transform:none;opacity:1}100%{transform:translateY(-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pcard.active,.pcard.active .pav,.dialog.pop,.toast{animation:none}}

/* ===== Extra: marcos llamativos y personalización ===== */
.box{box-shadow:4px 4px 0 var(--ink),inset 0 0 0 3px #fff,inset 0 0 0 5px var(--rosa)}
.dialog,.dialog.verdad,.dialog.reto{--k:var(--rosa);position:relative;box-shadow:6px 6px 0 var(--ink),inset 0 0 0 4px var(--k),inset 0 0 0 8px #fff,0 0 0 4px #fff,0 0 0 8px var(--ink),12px 12px 0 8px rgba(77,44,94,.22)}
.dialog.verdad{--k:#7fd0ff;background:linear-gradient(rgba(255,255,255,.95),rgba(228,243,255,.95))}
.dialog.reto{--k:#ff6f9f;background:linear-gradient(rgba(255,255,255,.95),rgba(255,230,240,.95))}
.dialog::before{content:"";position:absolute;inset:-12px;pointer-events:none;
 background:linear-gradient(var(--ink),var(--ink)) 0 0/18px 18px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 0/18px 18px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 100%/18px 18px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 100%/18px 18px no-repeat,
 linear-gradient(var(--k),var(--k)) 3px 3px/12px 12px no-repeat,linear-gradient(var(--k),var(--k)) calc(100% - 3px) 3px/12px 12px no-repeat,linear-gradient(var(--k),var(--k)) 3px calc(100% - 3px)/12px 12px no-repeat,linear-gradient(var(--k),var(--k)) calc(100% - 3px) calc(100% - 3px)/12px 12px no-repeat}
.dialog.verdad::after,.dialog.reto::after{position:absolute;inset-inline-end:14px;bottom:8px;font-size:34px;opacity:.3;line-height:1}
.dialog.verdad::after{content:"🔮"} .dialog.reto::after{content:"🔥"}
.banner{background:var(--pc,#fff)}
.banner.mine{background:repeating-linear-gradient(-45deg,#fff4b8 0 12px,#ffe98a 12px 24px) 0 0/34px 34px;animation:march 1s linear infinite;box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px var(--ink)}
@keyframes march{to{background-position:34px 0}}
.pcard{position:relative;background:var(--pc,#fff)}
.pcard.host,.pcard.guest{background:var(--pc,#c8f2d4)}
.pcard.f1{border-style:dashed;border-width:5px}
.pcard.f2{border-style:double;border-width:8px}
.pcard.f3{box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px var(--rosa)}
.pcard.f3::after{content:"✦";position:absolute;top:-14px;inset-inline-end:-10px;font-size:20px;color:#ffd54a;text-shadow:2px 2px 0 var(--ink)}
.pcard.active{animation:rb 1.4s steps(1) infinite}
@keyframes rb{0%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #ff7aa8}25%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #ffd54a}50%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #7fd0ff}75%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #8ce99a}}
.xp{width:88%;height:12px;border:3px solid var(--ink);background:#fff;overflow:hidden}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffd54a 0 6px,#ff9bb0 6px 12px)}
.swrow{gap:6px}
.swrow button.sw{background:var(--s);width:34px;height:34px}
.swrow button.sw[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-7px}
.reacts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.reacts button{font-size:22px;line-height:1;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:46px;height:44px;cursor:pointer;padding:0}
.reacts button:active{transform:translate(3px,3px);box-shadow:none}
.fl{position:fixed;bottom:18vh;left:var(--x);font-size:38px;z-index:40;pointer-events:none;animation:flo 2.2s ease-out forwards}
@keyframes flo{to{transform:translateY(-60vh) rotate(var(--r));opacity:0}}
.code{animation:cg 1.6s steps(1) infinite}
@keyframes cg{0%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #ff7aa8}33%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #7fd0ff}66%{box-shadow:4px 4px 0 var(--ink),0 0 0 4px #fff,0 0 0 8px #8ce99a}}
@media (prefers-reduced-motion:reduce){.banner.mine,.pcard.active,.code,.fl{animation:none}}
/* ===== Marcos extra (f0-f11) y personajes del perfil ===== */
.avrow.chars button{width:64px;height:64px;padding:4px}
.avrow button img,.pav img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.pav img{width:64px;height:64px}
.avrow button.fb{--pc:#fff4b8;background:var(--pc)}
.avrow button.fb[aria-pressed="true"]{background-color:var(--pc);outline:3px solid var(--ink);outline-offset:3px}
.avrow button.fb.f1{border-style:dashed;border-width:5px}
.avrow button.fb.f2{border-style:double;border-width:8px}
.avrow button.fb.f3{box-shadow:3px 3px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px var(--rosa)}
.pcard.f4,.avrow button.fb.f4{border-style:dotted;border-width:6px}
.pcard.f5,.avrow button.fb.f5{border-style:groove;border-width:8px;border-color:#ff9bb0}
.pcard.f6,.avrow button.fb.f6{border-style:ridge;border-width:8px;border-color:#7fd0ff}
.pcard.f7,.avrow button.fb.f7{box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px #ffd54a,0 0 0 9px var(--ink)}
.pcard.f8,.avrow button.fb.f8{border-color:#3aa0ff;box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px #7fd0ff}
.pcard.f9,.avrow button.fb.f9{border:5px solid transparent;background:linear-gradient(var(--pc),var(--pc)) padding-box,linear-gradient(90deg,#ff7aa8,#ffd54a,#8ce99a,#7fd0ff,#c9a6ff) border-box}
.pcard.f10,.avrow button.fb.f10{border:6px solid transparent;background:linear-gradient(var(--pc),var(--pc)) padding-box,repeating-linear-gradient(45deg,#ff7aa8 0 8px,#fff 8px 16px) border-box}
.pcard.f11,.avrow button.fb.f11{box-shadow:4px 4px 0 var(--ink),inset 0 0 0 3px #fff,inset 0 0 0 6px #cdb4db}
/* ===== Salas permanentes ===== */
.roombar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.rcode{direction:ltr;font-family:'Press Start 2P',monospace;font-size:18px;letter-spacing:4px;text-align:center;background:var(--amarillo);border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 12px;flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.mini{font:inherit;font-size:10px;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 10px;min-height:44px;cursor:pointer}
.mini:active{transform:translate(3px,3px);box-shadow:none}
.mini:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
html[lang="ar"] .mini{font-family:'Noto Kufi Arabic',sans-serif;font-size:13px}

/* ===== Stickers anime ===== */
.stkpanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:8px;background:var(--bg);border:3px solid var(--ink);max-height:220px;overflow-y:auto}
.stkpanel button{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--ink)}
.stkpanel button:active{transform:translate(3px,3px);box-shadow:none}
.stkpanel canvas{width:56px;height:56px;image-rendering:pixelated}
.bubble.stk{background:none!important;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bubble.stk canvas{width:110px;height:110px;image-rendering:pixelated;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 4px 0 rgba(77,44,94,.35))}
.bubble.stk b{font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink)}
.stkpanel img{width:56px;height:56px;object-fit:contain;image-rendering:auto;background:none}
.stkpanel .nostk{grid-column:1/-1;text-align:center;font-size:10px;padding:6px}
.bubble.stk img{width:auto;height:auto;max-width:130px;max-height:130px;border:0;background:none;image-rendering:auto;cursor:zoom-in;filter:drop-shadow(0 0 0 #fff) drop-shadow(3px 4px 0 rgba(77,44,94,.3))}
@media (prefers-reduced-motion:reduce){.bubble.stk{animation:none}}
</style>
</head>
<body>
<div class="deco" id="deco" aria-hidden="true"></div>
<button class="snd" id="bSnd" aria-label="Sound">🔊</button>
<div class="langs" role="group" aria-label="Language">
  <button data-l="es">ES</button><button data-l="en">EN</button><button data-l="ar">AR</button>
</div>

<main class="wrap">
  <!-- Pantalla de inicio -->
  <section id="home" style="display:flex;flex-direction:column;gap:16px">
    <h1 class="title" data-i="title">VERDAD O RETO</h1>
    <div class="box profile"><div class="msg" data-i="profile">Tu perfil</div><div class="avrow" id="avatars" role="group"></div><div class="msg" data-i="colorLbl">Tu color</div><div class="avrow swrow" id="colors" role="group"></div><div class="msg" data-i="frameLbl">Tu marco</div><div class="avrow" id="frames" role="group"></div><input id="nameIn" maxlength="12" autocomplete="off" data-ph="namePh" placeholder="Tu nombre"></div>
    <button class="btn verdad" id="bCreate" data-i="create">Crear sala</button>
    <div class="box" style="display:flex;flex-direction:column;gap:12px">
      <input id="inCode" maxlength="4" autocomplete="off" autocapitalize="characters" data-ph="codePh" placeholder="CÓDIGO">
      <button class="btn reto" id="bJoin" data-i="join">Unirme a la sala</button>
    </div>
    <div class="box hidden" id="myRoomsBox" style="flex-direction:column;gap:10px"><div class="msg" data-i="myRooms">Mis salas</div><div id="myRooms" style="display:flex;flex-direction:column;gap:8px"></div></div>
    <div class="box themes"><div class="trow" id="themes" role="group"></div><div class="msg" id="themeName"></div></div>
    <div id="homeMsg" class="msg"></div>
  </section>

  <!-- Juego -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:16px">
    <div class="roombar"><div class="rcode" id="gCode">····</div><button class="mini" id="bCopy" data-i="copyS">Copiar</button><button class="mini" id="bHome" data-i="homeS">Inicio</button><button class="mini" id="bLeave" data-i="leaveS">Salir</button></div>
    <div class="pcards" id="scores"></div>
    <div class="banner" id="banner"></div>
    <div class="dialog" id="dialog"><div id="tag"></div><span id="qText"></span></div>
    <div class="row" id="choose">
      <button class="btn verdad" data-a="verdad" data-i="truth">Verdad</button>
      <button class="btn reto" data-a="reto" data-i="dare">Reto</button>
    </div>
    <div class="row" id="actions">
      <button class="btn ok" data-a="done" data-i="done">Lo hice</button>
      <button class="btn skip" data-a="skip" data-i="skip">Pasar</button>
    </div>

    <div class="reacts" id="reacts" role="group" aria-label="Reacciones"></div>
    <!-- Música (YouTube) -->
    <div class="row"><button class="btn music" id="bMusic" data-i="music">Video</button><button class="btn" id="bChat" data-i="chat">Chat</button></div>
    <div class="box hidden" id="musicBox" style="display:flex;flex-direction:column;gap:12px">
      <input id="musicIn" autocomplete="off" data-ph="musicPh" placeholder="Pega un enlace de YouTube">
      <div class="row">
        <button class="btn ok" id="bPlay" data-i="musicPlay">Reproducir</button>
        <button class="btn skip" id="bStop" data-i="musicStop">Detener</button>
      </div>
      <button class="btn" id="bTrans" aria-pressed="false">Traducir: NO</button>
      <div class="msg" id="musicMsg"></div>
      <div id="player"></div>
    </div>

    <!-- Chat de la partida -->
    <div class="box chat hidden" id="chat">
      <div class="chatlog" id="chatLog" aria-live="polite"></div>
      <input id="chatIn" maxlength="300" autocomplete="off" data-ph="chatPh" placeholder="Escribe un mensaje...">
      <div class="chatbar">
        <button class="btn" id="bImg" data-i="image">Imagen</button>
        <button class="btn" id="bStk" data-i="sticker">Sticker</button>
        <button class="btn ok" id="bSend" data-i="send">Enviar</button>
      </div>
      <div class="stkpanel hidden" id="stkPanel"></div>
      <input type="file" id="imgIn" accept="image/*" class="hidden">
    </div>
  </section>

</main>

      for(let k=0;k<n;k++){ const ty=y0+k*t2*.75; for(let y=0;y<t2*1.25;y++){ const half=R((y/(t2*1.25))*w*(.45+k*.18)); px(x-half,ty+y,half*2+1,1,c1); px(x+half*.2,ty+y,Math.max(1,R(half*.8)),1,c2); }
        if(sn){ px(x-1,ty,3,1,sn); px(x-R(w*.2),ty+R(t2*.5),R(w*.25),1,sn); } } };
    for(let i=0;i<6;i++){ const hg=H*(.13+r()*.1), w=hg*.28; pine(W*.01+i*W*.035+r()*4,H*.9-hg,hg,w); pine(W*.99-i*W*.035-r()*4,H*.9-hg*.9,hg*.9,w*.9); }

  // casita con chimenea, puerta y ventana iluminada

    px(hx+10*u,hy-17*u,2*u,5*u,"#8a5a6a"); px(hx+10*u,hy-17*u,2*u,u,"#5a3a4a");

function newPetal(init){
  const f=th.fx, o={k:f,x:Math.random()*W*1.2-W*.1,y:init?Math.random()*H:-4-Math.random()*H*.2,c:th.pc[(Math.random()*th.pc.length)|0],ph:Math.random()*6.28,amp:.3+Math.random()*.8,s:Math.random()<.25?2:1};

  if(f==="snow") return Object.assign(o,{vy:.15+Math.random()*.35,vx:.03+Math.random()*.1});
  if(f==="star") return Object.assign(o,{x:Math.random()*W,y:Math.random()*H*.65});
  if(f==="mote") return Object.assign(o,{x:Math.random()*W,y:init?Math.random()*H:H+3,vy:-.1-Math.random()*.2,vx:0,s:1});
  return {k:"petal",x:Math.random()*W*1.2-W*.1, y:init?Math.random()*H:-4-Math.random()*H*.2, vy:.18+Math.random()*.32, vx:.05+Math.random()*.12,
    amp:.4+Math.random()*1.2, ph:Math.random()*6.28, f:Math.random()*4, c:(th.pl||PINK)[(Math.random()*4)|0], s:Math.random()<.25?2:1};
}
function drawPetal(p){
  g.fillStyle=p.c;
  if(p.k!=="petal"){
    const x=Math.round(p.x), y=Math.round(p.y), q=Math.max(1,Math.round(p.s*Z));
    if(p.k==="rain") g.fillRect(x,y,q,q*3);
    else if(p.k==="star"){ g.globalAlpha=.25+.75*Math.abs(Math.sin(p.ph)); g.fillRect(x,y,q,q); g.globalAlpha=1; }
    else g.fillRect(x,y,q,q);
    return;
  }
  const q=Math.max(1,Math.round(p.s*Z));
  FR[(p.f|0)%4].forEach(([dx,dy])=>g.fillRect(Math.round(p.x)+dx*q,Math.round(p.y)+dy*q,q,q));
}
function movePetal(p,dt){
  if(p.k!=="petal"){
    p.ph+=.03*dt; if(p.k==="star") return;
    p.y+=p.vy*dt*Z; p.x+=(p.k==="rain"?p.vx:p.vx+Math.sin(p.ph)*p.amp*.3)*dt*Z;
    if(p.k==="mote"?p.y<-4:(p.y>H+3||p.x>W+6)) Object.assign(p,newPetal(false));
    return;
  }
  p.ph+=.03*dt; p.f+=.06*dt;
  p.y+=p.vy*dt*Z; p.x+=(p.vx+Math.sin(p.ph)*p.amp*.3)*dt*Z;
  if(p.y>H+3||p.x>W+6){ Object.assign(p,newPetal(false)); p.x=Math.random()*W*1.1-W*.2; }
}
/* Efectos llamativos por tema: halo que respira, rayos de luz, estrellas fugaces y relámpagos */
function overlay(t,dt){

}
function cloudSprite(c){ const k=c.k; g.globalAlpha=c.a; g.fillStyle=th.cl[1]; g.fillRect(Math.round(c.x),Math.round(c.y+3*k),Math.round(12*k),Math.round(k));

function life(t,dt){

    smoke=smoke.filter(p=>p.a>0); smoke.forEach(p=>{ p.y-=.18*dt*Z; p.x+=(Math.sin(p.ph+=.05*dt)*.15+.1)*dt*Z; p.a-=.004*dt; p.s+=.012*dt;
      g.globalAlpha=Math.max(0,p.a); const q=Math.round(Z*p.s)+1; g.fillRect(Math.round(p.x),Math.round(p.y),q,q); }); g.globalAlpha=1; }
  // faroles de papel que suben
  lants.forEach(l=>{ l.ph+=.03*dt; l.y-=l.v*dt*Z; l.x+=Math.sin(l.ph)*.2*dt; if(l.y<-8){ l.y=H+4; l.x=Math.random()*W; }
    const x=Math.round(l.x), y=Math.round(l.y); g.globalAlpha=.22+.08*Math.sin(l.ph*3); g.fillStyle="#ffb04a"; g.fillRect(x-Z*2,y-Z*2,Z*6,Z*7);
    g.globalAlpha=1; g.fillRect(x,y,Z*2,Z*3); g.fillStyle="#ffe08a"; g.fillRect(x,y,Z*2,Z); });
  // mariposas
  flits.forEach(f=>{ f.ph+=.03*dt; const x=Math.round(f.bx+Math.sin(f.ph*.6)*W*.08), y=Math.round(f.by+Math.sin(f.ph*.9)*H*.04), w=(1+Math.round(Math.abs(Math.sin(f.ph*6))*2))*Z;
    g.fillStyle=f.c; g.fillRect(x-w,y-Z,w,Z*2); g.fillRect(x+Z,y-Z,w,Z*2); g.fillStyle=th.k.x; g.fillRect(x,y-Z,Z,Z*3); });
  clouds.forEach(c=>{ c.x+=c.v*dt; if(c.x>W+14*c.k) c.x=-14*c.k; cloudSprite(c); });
  birds.forEach(b2=>{ b2.x+=b2.v*dt*Z; b2.ph+=.14*dt; if(b2.x>W+8) b2.x=-8; const up=Math.sin(b2.ph)>0, x=Math.round(b2.x), y=Math.round(b2.y+Math.sin(b2.ph*.25)*2), q=Z;
    g.fillStyle=th.k.x; g.fillRect(x,y,q,q);
    for(let i=1;i<=3;i++){ const dy=up?-i*q:Math.round(i*q*.5); g.fillRect(x-i*q,y+dy,q,q); g.fillRect(x+i*q,y+dy,q,q); } });
  flies.forEach(f=>{ f.ph+=.04*dt; f.x+=Math.sin(f.ph*.7)*.25*dt; f.y+=Math.cos(f.ph*.5)*.18*dt; const a=.3+.7*Math.max(0,Math.sin(f.ph*1.3));
    g.globalAlpha=a*.25; g.fillStyle=th.glow; g.fillRect(Math.round(f.x)-Z,Math.round(f.y)-Z,Z*3,Z*3);
    g.globalAlpha=a; g.fillStyle="#fffbd0"; g.fillRect(Math.round(f.x),Math.round(f.y),Z,Z); g.globalAlpha=1; });
}
let last=0;

  birds=(!th.dk&&!th.nb&&!th.fx.match(/rain|snow/))?[0,1,2].map(i=>({x:R2()*W,y:H*(.12+R2()*.2),v:.12+R2()*.08,ph:R2()*6})):[];
  flies=(th.shoot||th.fl)?Array.from({length:16},()=>({x:R2()*W,y:H*(.7+R2()*.25),ph:R2()*6})):[];

  flits=(themeKey==="sakura"||themeKey==="arcoiris"||themeKey==="amanecer"||themeKey==="verano"||themeKey==="momiji")?Array.from({length:5},(_,i)=>({bx:W*(.15+R2()*.7),by:H*(.68+R2()*.17),ph:R2()*6,c:th.pc[i%th.pc.length]})):[];
  const n=Math.round(Math.max(28,Math.min(80,Math.round(W/10)))*(th.n||1));

/* ===== Salas permanentes en Firestore =====
   Cada sala es un documento salas/{CÓDIGO} y nunca se borra: los jugadores pueden salir y volver con el mismo código.
   Las jugadas se aplican con transacciones, así que ya no hace falta un anfitrión conectado. */
const ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sin 0, O, 1, I
let role=null, code=null, S=null, pools={verdad:[],reto:[]};
let unsubRoom=null, unsubChat=null, firstRoomSnap=true, lastVidSeq=null, lastFx=null;

/* Identidad del dispositivo: reserva tu asiento en la sala aunque cierres la página */
let UID=null;
try{ UID=localStorage.getItem("vor-uid"); }catch(e){}
if(!UID){
  UID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Array.from({length:24},()=>ABC[Math.floor(Math.random()*ABC.length)]).join("");
  try{ localStorage.setItem("vor-uid",UID); }catch(e){}
}

function show(id){
  ["home","game"].forEach(s=>$("#"+s).classList.toggle("hidden",s!==id));
  if(id!=="game") destroyVideo();
}
function setMsg(el,key,err){ el.dataset.i=key; el.textContent=t(key); el.classList.toggle("err",!!err); }
function clearMsg(){ const m=$("#homeMsg"); delete m.dataset.i; m.textContent=""; m.classList.remove("err"); }
const genCode = ()=>Array.from({length:4},()=>ABC[Math.floor(Math.random()*ABC.length)]).join("");
const roomRef = c => fsMod.doc(db,"salas",c);
const prof = ()=>({name:cleanName(me.name,""),av:me.av,c:me.c,f:me.f});

/* Lista local de "Mis salas" y sala actual (para volver automáticamente al recargar) */
function getRooms(){ try{ const a=JSON.parse(localStorage.getItem("vor-rooms")||"[]"); return Array.isArray(a)?a.filter(x=>x&&/^[A-Z0-9]{4}$/.test(x.code)):[]; }catch(e){ return []; } }
function setRooms(a){ try{ localStorage.setItem("vor-rooms",JSON.stringify(a)); }catch(e){} }
function addRoom(c){ setRooms([{code:c},...getRooms().filter(x=>x.code!==c)].slice(0,8)); }
function dropRoom(c){ setRooms(getRooms().filter(x=>x.code!==c)); }
function setCurrent(c){ try{ c?localStorage.setItem("vor-room",c):localStorage.removeItem("vor-room"); }catch(e){} }
function paintRooms(){
  const l=getRooms(), box=$("#myRoomsBox"), list=$("#myRooms");
  box.classList.toggle("hidden",!l.length); list.textContent="";
  l.forEach(x=>{ const bt=document.createElement("button"); bt.className="btn ok"; bt.textContent=x.code+" · "+t("enter"); bt.onclick=()=>enterRoom(x.code); list.appendChild(bt); });
}

function unsub(){
  try{ unsubRoom&&unsubRoom(); }catch(e){} try{ unsubChat&&unsubChat(); }catch(e){}
  unsubRoom=unsubChat=null;
}
function goHome(){
  unsub(); code=role=S=null; prev=null; shownKey=""; setCurrent(null); destroyVideo(); show("home"); paintRooms();
}
function fail(key){ goHome(); setMsg($("#homeMsg"),key,true); }
const errKey = e => (e&&e.code==="permission-denied")?"errRules":"errGeneric";

/* Lee preguntas de Firestore (con límite de tiempo); si falla usa el respaldo */
async function loadQuestions(){
  let list=[];
  try{
    const snap = await Promise.race([
      getDb().then(d=>fsMod.getDocs(fsMod.collection(d,"preguntas"))),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))
    ]);
    snap.forEach(d=>{ const x=d.data(); if((x.tipo==="verdad"||x.tipo==="reto")&&x.es) list.push({tipo:x.tipo,es:x.es,en:x.en||"",ar:x.ar||""}); });
  }catch(e){ console.warn("Firestore falló, uso respaldo:",e); }
  if(!list.length) list=BACKUP;
  pools={verdad:list.filter(q=>q.tipo==="verdad"),reto:list.filter(q=>q.tipo==="reto")};
  ["verdad","reto"].forEach(k=>{ if(!pools[k].length) pools[k]=BACKUP.filter(q=>q.tipo===k); });
}
/* Elige al azar sin repetir hasta agotar todas (la lista de usadas se guarda en la sala) */
function pickQ(kind,used){
  const pool=pools[kind]; let u=used[kind]||[];
  let free=pool.filter(q=>!u.includes(q.es));
  if(!free.length){ u=[]; free=pool.slice(); }
  const q=free[Math.floor(Math.random()*free.length)]; u.push(q.es); used[kind]=u;
  return {tipo:q.tipo,es:q.es,en:q.en||"",ar:q.ar||""};
}
function newS(){
  return {n:0,turn:"host",phase:"choose",kind:null,q:null,
    counts:{host:{verdad:0,reto:0},guest:{verdad:0,reto:0}},
    players:{host:prof(),guest:null}, seats:{host:UID,guest:null}};
}

/* ----- Crear sala: el código queda guardado para siempre ----- */
async function createRoom(){
  setMsg($("#homeMsg"),"creating");
  try{
    await getDb(); await loadQuestions();
    for(let n=0;n<8;n++){
      const c=genCode(), ref=roomRef(c);
      const ok=await fsMod.runTransaction(db,async tx=>{
        if((await tx.get(ref)).exists()) return false;
        tx.set(ref,{createdAt:Date.now(),updatedAt:Date.now(),S:newS(),used:{verdad:[],reto:[]},vid:null,fx:null});
        return true;
      });
      if(ok){ await enterRoom(c); return; }
    }
    fail("errGeneric");
  }catch(e){ console.error(e); fail(errKey(e)); }
}
function joinRoom(){ enterRoom($("#inCode").value); }

/* ----- Entrar (o volver) a una sala con su código ----- */
async function enterRoom(c){
  c=String(c||"").trim().toUpperCase();
  if(c.length!==4){ setMsg($("#homeMsg"),"badCode",true); return; }
  setMsg($("#homeMsg"),"connecting");
  try{
    await getDb(); if(!pools.verdad.length) await loadQuestions();
    const res=await fsMod.runTransaction(db,async tx=>{
      const ref=roomRef(c), snap=await tx.get(ref);
      if(!snap.exists()) return {err:"roomNotFound"};
      const s=snap.data().S, seats=s.seats||{}, p=prof();
      let r=null;
      if(seats.host===UID) r="host";            // ya tenías asiento: vuelves a él
      else if(seats.guest===UID) r="guest";
      else if(!seats.guest) r="guest";          // asiento libre
      else if(!seats.host) r="host";
      if(!r) return {err:"roomFull"};
      const o=r==="host"?"guest":"host";
      if(s.players[o]&&s.players[o].av&&s.players[o].av===p.av) p.av=(CHARS.find(a=>a.id!==p.av)||{id:p.av}).id;
      seats[r]=UID; s.seats=seats; s.players[r]=p;
      tx.update(ref,{S:s,updatedAt:Date.now()});
      return {role:r};
    });
    if(res.err){ if(res.err==="roomNotFound"){ dropRoom(c); setCurrent(null); } return fail(res.err); }
    unsub(); destroyVideo();
    role=res.role; code=c; addRoom(c); setCurrent(c); clearMsg(); subscribe();
  }catch(e){ console.error(e); fail(errKey(e)); }
}

/* Escucha la sala en tiempo real; si un jugador sale y vuelve, el estado sigue ahí */
function subscribe(){
  S=null; prev=null; shownKey=""; firstRoomSnap=true; lastVidSeq=null; lastFx=null;
  $("#chatLog").textContent=""; $("#gCode").textContent=code;
  unsubRoom=fsMod.onSnapshot(roomRef(code),snap=>{
    if(!snap.exists()){ dropRoom(code); goHome(); setMsg($("#homeMsg"),"roomGone",true); return; }
    const d=snap.data();
    if(!d.S||!d.S.seats||d.S.seats[role]!==UID){
      if(snap.metadata.fromCache) return; // dato viejo de la caché: espera al servidor
      dropRoom(code); goHome(); setMsg($("#homeMsg"),"roomFull",true); return;
    }
    S=d.S; show("game"); render();
    handleFx(d.fx); handleVid(d.vid);
    if(firstRoomSnap){ firstRoomSnap=false; startChat(); }
  },e=>{ console.error(e); fail(errKey(e)); });
}

/* Jugadas: se validan y aplican dentro de una transacción */
async function act(a){
  if(!code||!role) return;
  try{
    await fsMod.runTransaction(db,async tx=>{
      const ref=roomRef(code), snap=await tx.get(ref); if(!snap.exists()) return;
      const d=snap.data(), s=d.S, used=d.used||{verdad:[],reto:[]};
      if(s.turn!==role||s.seats[role]!==UID) return;
      if(s.phase==="choose" && a.t==="choose" && (a.kind==="verdad"||a.kind==="reto")){
        s.q=pickQ(a.kind,used); s.kind=a.kind; s.phase="question"; s.n++;
      } else if(s.phase==="question" && (a.t==="done"||a.t==="skip")){
        if(a.t==="done") s.counts[role][s.kind]++;
        s.turn=role==="host"?"guest":"host"; s.phase="choose"; s.kind=null; s.q=null; s.n++;
      } else return;
      tx.update(ref,{S:s,used,updatedAt:Date.now()});
    });
  }catch(e){ console.error(e); }
}

/* Salir de verdad: libera tu asiento (la sala y su código siguen existiendo) */
async function leaveRoom(){
  if(!code||!role) return;
  if(!confirm(t("leaveAsk"))) return;
  const c=code, r=role;
  try{
    await fsMod.runTransaction(db,async tx=>{
      const ref=roomRef(c), snap=await tx.get(ref); if(!snap.exists()) return;
      const s=snap.data().S;
      if(s.seats[r]===UID){ s.seats[r]=null; s.players[r]=null; s.counts[r]={verdad:0,reto:0}; tx.update(ref,{S:s,updatedAt:Date.now()}); }
    });
  }catch(e){ console.error(e); }
  dropRoom(c); goHome();
}

/* Reacciones y video sincronizado viajan como campos de la sala */
function handleFx(f){
  if(!f||f.id===lastFx) return; lastFx=f.id;
  if(firstRoomSnap||f.by===UID) return;
  if(REACTS.includes(f.e)&&Date.now()-f.ts<10000) floatReact(f.e);
}
function sendReact(e){
  if(!code) return;
  fsMod.updateDoc(roomRef(code),{fx:{e,by:UID,ts:Date.now(),id:Date.now()+"-"+Math.random().toString(36).slice(2,6)}}).catch(()=>{});
}
function handleVid(v){
  if(!v||v.seq===lastVidSeq) return; lastVidSeq=v.seq;
  if(firstRoomSnap||v.by===UID) return;
  onVid(v);
}

/* Chat guardado en salas/{código}/chat: al volver ves la conversación */
function startChat(){
  startStickers();
  const q=fsMod.query(fsMod.collection(db,"salas",code,"chat"),fsMod.orderBy("ts"),fsMod.limitToLast(60));
  let first=true;
  unsubChat=fsMod.onSnapshot(q,snap=>{
    const ch=snap.docChanges().filter(c=>c.type==="added"), live=!first; first=false;
    ch.forEach((c,i)=>onChatDoc(c.doc.data(),live,live||i>=ch.length-6));
  },e=>console.error(e));
}
function onChatDoc(m,live,tr){
  if(!m||typeof m.by!=="string") return;
  const mine=m.by===UID;
  if(m.type==="img"){ if(typeof m.data==="string"&&m.data.length<900000&&IMG_OK.test(m.data)) addImg(m.data,mine,live); }
  else if(m.type==="stk"&&typeof m.sid==="string"&&m.sid.length<80&&!m.sid.includes("/")) recvStk(m.sid,mine,live);
  else if(m.type==="stk"&&Number.isInteger(m.id)&&m.id>=0&&m.id<STK.length) addStk(m.id,mine,live);
  else if(m.type==="msg"&&typeof m.text==="string") receiveChat(m,mine,live,tr);
}

/* ===== Pantalla del juego ===== */
let typeTimer=null, shownKey="";

const TRANSLATE_URL = "https://verdadreto-traductor.adhlyrics.workers.dev/";

/* Mensaje recibido: se muestra al instante y, si el otro jugador usa otro idioma, se reemplaza por la traducción (con el original debajo) */
async function receiveChat(m,mine,live,tr){
  const text=m.text.slice(0,300), from=LANGS.includes(m.lang)?m.lang:null;
  const bubble=addMsg(text,mine,live);
  if(mine||!tr||!TRANSLATE_URL||!from||from===lang) return;
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(TRANSLATE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,from,to:lang}),signal:ctl.signal});
    const j=await r.json();
    const out=(j&&typeof j.translated==="string")?j.translated.trim():"";
    if(!r.ok||!out||out===text) return;
    bubble.textContent="";
    const main=document.createElement("div"); main.dir="auto"; main.textContent=out;
    const orig=document.createElement("div"); orig.className="orig"; orig.dir="auto"; orig.textContent=text;
    bubble.append(main,orig);
    const log=$("#chatLog"); log.scrollTop=log.scrollHeight;
  }catch(e){ console.warn("Traducción falló:",e); }
  finally{ clearTimeout(timer); }
}

/* Reduce la foto (máx. 800px, JPEG) para que viaje rápido por PeerJS */
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",q));
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    im.src=url;
  });
}
async function sendImage(file){
  if(!file||!file.type.startsWith("image/")||!code) return;
  try{
    let data=await shrink(file,800,0.72);
    if(data.length>800000) data=await shrink(file,480,0.5); // un documento de Firestore admite ~1 MB
    await fsMod.addDoc(fsMod.collection(db,"salas",code,"chat"),{type:"img",by:UID,data,ts:Date.now()});
  }catch(e){ console.error(e); }
}

/* ===== Video de YouTube sincronizado (play, pausa y adelantar se replican en el otro jugador) ===== */
function ytId(url){
  try{
    let s=url.trim(); if(!/^https?:\/\//i.test(s)) s="https://"+s;
    const u=new URL(s), h=u.hostname.replace(/^(www|m|music)\./,""); let id=null;
    if(h==="youtu.be") id=u.pathname.slice(1).split("/")[0];
    else if(h==="youtube.com"||h==="youtube-nocookie.com"){
      if(u.pathname==="/watch") id=u.searchParams.get("v");
      else { const m=u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/); id=m&&m[1]; }
    }
    return /^[\w-]{11}$/.test(id||"")?id:null;
  }catch(e){ return null; }
}
let yt=null, ytApi=null, applying=false, applyTimer=null, lastT=0, lastW=0;
function loadYT(){
  if(window.YT&&window.YT.Player) return Promise.resolve();
  if(!ytApi) ytApi=new Promise(res=>{
    window.onYouTubeIframeAPIReady=res;
    const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function sendVid(o){ if(!code) return; fsMod.updateDoc(roomRef(code),{vid:{...o,by:UID,seq:Date.now()+"-"+Math.random().toString(36).slice(2,6)}}).catch(e=>console.error(e)); }
function syncBase(){ try{ lastT=yt.getCurrentTime(); lastW=Date.now(); }catch(e){} }
/* Mientras aplico una orden del otro jugador ignoro mis propios eventos (evita rebotes) */
function applyRemote(fn){
  applying=true; clearTimeout(applyTimer);
  try{ fn(); }catch(e){ console.error(e); }
  applyTimer=setTimeout(()=>{ applying=false; syncBase(); },1200);
}
function destroyVideo(){
  trDone=false; clearTimeout(trTimer);
  try{ yt&&yt.destroy&&yt.destroy(); }catch(e){}
  yt=null; $("#player").textContent="";
}
async function loadVideo(id){
  await loadYT();
  if(yt && typeof yt.loadVideoById==="function"){ trDone=false; applyRemote(()=>yt.loadVideoById(id)); return; }
  destroyVideo();
  const d=document.createElement("div"); d.id="ytp"; $("#player").appendChild(d);
  applying=true;
  yt=new YT.Player("ytp",{videoId:id,width:"100%",height:"100%",
    playerVars:{autoplay:1,playsinline:1,rel:0},
    events:{onReady:e=>applyRemote(()=>e.target.playVideo()),onStateChange:e=>{ if(e.data===1&&trOn&&!trDone){ trDone=true; trTry=0; setTimeout(applyTrans,800); } onYtState(e); }}});
}
function onYtState(e){
  if(applying||!yt||typeof yt.getCurrentTime!=="function") return;
  const t=yt.getCurrentTime();
  if(e.data===1) sendVid({a:"play",time:t});
  else if(e.data===2) sendVid({a:"pause",time:t});
  lastT=t; lastW=Date.now();
}
/* Detecta saltos de tiempo (adelantar/atrasar) */
setInterval(()=>{
  if(!yt||applying||typeof yt.getPlayerState!=="function") return;
  try{
    const st=yt.getPlayerState(), t=yt.getCurrentTime(), now=Date.now();
    if(st===3) return;
    const exp=lastT+(st===1?(now-lastW)/1000:0);
    if(Math.abs(t-exp)>1.5) sendVid({a:"seek",time:t,playing:st===1});
    lastT=t; lastW=now;
  }catch(e){}
},500);
function onVid(m){
  if(m.a==="load"){
    if(typeof m.id==="string" && /^[\w-]{11}$/.test(m.id)){ $("#musicBox").classList.remove("hidden"); loadVideo(m.id); }
    return;
  }
  if(m.a==="stop"){ destroyVideo(); return; }
  if(!yt||typeof yt.seekTo!=="function"||typeof m.time!=="number"||!isFinite(m.time)) return;
  applyRemote(()=>{
    if(Math.abs(yt.getCurrentTime()-m.time)>1.2) yt.seekTo(m.time,true);
    if(m.a==="play"||(m.a==="seek"&&m.playing)) yt.playVideo(); else yt.pauseVideo();
  });
}
function playMusic(){
  const m=$("#musicMsg"), id=ytId($("#musicIn").value);
  if(!id){ setMsg(m,"musicBad",true); return; }
  delete m.dataset.i; m.textContent=""; m.classList.remove("err");
  loadVideo(id); sendVid({a:"load",id});
}
function stopMusic(){ destroyVideo(); sendVid({a:"stop"}); }

/* ===== Traducción de subtítulos (gratis: traductor automático de YouTube, sin claves ni límite de tokens) =====
   Es local: cada jugador la activa o apaga y se traduce al idioma de SU página (es/en/ar). */
let trOn=false, trTry=0, trTimer=null, trDone=false;
function trLabel(){ const b=$("#bTrans"); b.setAttribute("aria-pressed",String(trOn)); b.textContent=t(trOn?"trOn":"trOff"); }
function applyTrans(){
  clearTimeout(trTimer);
  if(!yt||typeof yt.setOption!=="function") return;
  const m=$("#musicMsg");
  try{
    if(!trOn){ yt.unloadModule("captions"); delete m.dataset.i; m.textContent=""; m.classList.remove("err"); return; }
    yt.loadModule("captions");
    const tl=yt.getOption("captions","tracklist")||[];
    if(!tl.length){
      if(++trTry<=12){ setMsg(m,"trWait"); trTimer=setTimeout(applyTrans,1000); } else setMsg(m,"trNoCc",true);
      return;
    }
    const tr=tl.find(x=>x.languageCode===lang);
    yt.setOption("captions","track",tr?{languageCode:tr.languageCode}:{languageCode:tl[0].languageCode,translationLanguage:lang});
    setMsg(m,"trOk");
  }catch(e){ console.warn(e); }
}
$("#bTrans").onclick=()=>{ trOn=!trOn; trTry=0; trLabel(); applyTrans(); };
trLabel();

function floatReact(e){ const d=document.createElement("div"); d.className="fl"; d.textContent=e; d.style.setProperty("--x",(10+Math.random()*75)+"vw"); d.style.setProperty("--r",(Math.random()*50-25)+"deg"); document.body.appendChild(d); setTimeout(()=>d.remove(),2300); }
REACTS.forEach(e=>{ const bt=document.createElement("button"); bt.textContent=e; bt.setAttribute("aria-label",e); bt.onclick=()=>{ floatReact(e); beep(SFX.pick); sendReact(e); }; $("#reacts").appendChild(bt); });
$("#bCopy").onclick=()=>{ if(!code) return; try{ navigator.clipboard.writeText(code).then(()=>toast(t("copied"),"ok")); }catch(e){} };

{ let cur=null; try{ cur=localStorage.getItem("vor-room"); }catch(e){} if(cur) enterRoom(cur); }
